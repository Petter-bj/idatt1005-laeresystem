<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />

  <title>Systemutvikling – Læresystem (IDATT1005)</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#app">Hopp til innhold</a>
  <header class="topbar">
    <button class="brand" data-route="#/" aria-label="Hjem">
      <span class="brand-logo">SU</span>
      <span class="brand-text">Systemutvikling<small>IDATT1005</small></span>
    </button>
    <nav class="mainnav" id="mainnav">
      <a href="#/laer" data-match="laer">Lær</a>

  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <span>Læresystem for IDATT1005 Systemutvikling · eksamen 3. juni 2026</span>
    <button class="link-btn" id="resetBtn">Nullstill fremdrift</button>
  </footer>

  <!-- Bibliotek (offline) -->

  <script src="data/flashcards.js"></script>
  <script src="data/quizzes.js"></script>
  <script src="data/uml.js"></script>
  <script src="data/exams.js"></script>

  <!-- Logikk -->
  <script src="js/progress.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/flashcards.js"></script>
  <script src="js/uml.js"></script>

  <script src="js/chat.js"></script>
